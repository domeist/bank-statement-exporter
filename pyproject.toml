[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Long single-line CSV fixtures are clearer than wrapped ones.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
# The package is imported from the repo root, which the `pytest` console
# script (unlike `python -m pytest`) does not add to sys.path.
pythonpath = ["."]
testpaths = ["tests"]
